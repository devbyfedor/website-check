<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dachdeckerei Ziegelfabel – Dächer und Fassaden</title>
<!--
  Synthetic homepage for legal link finding (session A4), case 20-grossbuchstaben-verschachtelt.
  Link texts in capitals and nested in spans: "IMPRESSUM" in capitals in the DOM next to a symbol span, "Datenschutz" shown in capitals by CSS text-transform.
  Every company and place is invented; every domain ends in .example.
  Expected values: scanner/fixtures/legal-links/expected.json.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #1f1f1f; background: #ffffff; }
  header, main, footer, .site-footer, [role="contentinfo"] { padding: 16px 32px; }
  .kopf { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; border-bottom: 1px solid #dddddd; }
  .logo { font-weight: bold; font-size: 20px; color: #1f1f1f; text-decoration: none; }
  nav a { margin-right: 16px; color: #1f3a5f; }
  .hero { background: #f3f0ea; padding: 24px; margin: 16px 0; }
  footer, .site-footer, [role="contentinfo"] { border-top: 1px solid #dddddd; font-size: 14px; }
  .caps { text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>
<body>
<header class="kopf">
  <a class="logo" href="/">Dachdeckerei Ziegelfabel</a>
  <nav aria-label="Hauptnavigation">
      <a href="/">Start</a>
      <a href="/leistungen">Leistungen</a>
      <a href="/ueber-uns">Über uns</a>
      <a href="/kontakt">Kontakt</a>
  </nav>
  
</header>
<main>
<section class="hero">
  <h1>Dächer, die halten</h1>
  <p>Steildach, Flachdach und Fassade.</p>
</section>
</main>
<footer>
  <nav aria-label="Rechtliches">
      <a href="/impressum/"><span aria-hidden="true">§</span> <span>IMPRESSUM</span></a>
      <a href="/datenschutz/"><span class="caps">Datenschutz</span></a>
  </nav>
  <p>© 2026 Dachdeckerei Ziegelfabel</p>
</footer>
</body>
</html>
