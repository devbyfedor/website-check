<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baustoffe Mörtelfabel – Baustoffhandel</title>
<!--
  Synthetic homepage for legal link finding (session A4), case 14-viele-links-davor.
  An inline script adds 1,600 category links to a navigation before the footer; the footer with Impressum, Datenschutz and a "Barrierefreiheit" statement link comes after them in document order.
  Every company and place is invented; every domain ends in .example.
  Expected values: scanner/fixtures/legal-links/expected.json.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #1f1f1f; background: #ffffff; }
  header, main, footer, .site-footer, [role="contentinfo"] { padding: 16px 32px; }
  .kopf { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; border-bottom: 1px solid #dddddd; }
  .logo { font-weight: bold; font-size: 20px; color: #1f1f1f; text-decoration: none; }
  nav a { margin-right: 16px; color: #1f3a5f; }
  .hero { background: #f3f0ea; padding: 24px; margin: 16px 0; }
  footer, .site-footer, [role="contentinfo"] { border-top: 1px solid #dddddd; font-size: 14px; }

</style>
</head>
<body>
<header class="kopf">
  <a class="logo" href="/">Baustoffe Mörtelfabel</a>
  <nav aria-label="Hauptnavigation">
      <a href="/">Start</a>
      <a href="/leistungen">Leistungen</a>
      <a href="/ueber-uns">Über uns</a>
      <a href="/kontakt">Kontakt</a>
  </nav>
  
</header>
<main>
<section class="hero">
  <h1>Alles für den Bau</h1>
  <p>Über tausend Artikel ab Lager.</p>
</section>
<nav id="kategorien" aria-label="Kategorien"></nav>
<script>
  (function () {
    var nav = document.getElementById('kategorien');
    for (var i = 1; i <= 1600; i++) {
      var link = document.createElement('a');
      link.href = '/kategorie/' + i;
      link.textContent = 'Kategorie ' + i;
      nav.appendChild(link);
      nav.appendChild(document.createTextNode(' '));
    }
  })();
</script>
</main>
<footer>
  <nav aria-label="Rechtliches">
      <a href="/impressum">Impressum</a>
      <a href="/datenschutz">Datenschutz</a>
      <a href="/barrierefreiheit">Barrierefreiheit</a>
  </nav>
  <p>© 2026 Baustoffe Mörtelfabel</p>
</footer>
</body>
</html>
