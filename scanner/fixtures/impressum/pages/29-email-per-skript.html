<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum – Glaserei Scheibenfabel</title>
<!--
  Synthetic Impressum fixture (session A4), case 29-email-per-skript.
  The e-mail is assembled by an inline script at page load and written as text into an empty span; the HTML source never contains the address in one piece, the rendered page shows it as plain text.
  Every company, person, street, town, postcode, phone, register and VAT number is invented; every domain ends in .example.
  Expected values: scanner/fixtures/impressum/expected.json.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #1f1f1f; background: #ffffff; }
  header, main, footer { padding: 16px 32px; }
  header { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between; border-bottom: 1px solid #dddddd; }
  .logo { font-weight: bold; font-size: 20px; }
  header nav a, footer nav a { margin-right: 16px; color: #1f3a5f; }
  main { max-width: 760px; }
  footer { border-top: 1px solid #dddddd; font-size: 14px; }

</style>
</head>
<body>
<header>
  <div class="logo">Glaserei Scheibenfabel</div>
  
  <nav aria-label="Hauptnavigation">
    <a href="/">Start</a>
    <a href="/leistungen">Leistungen</a>
    <a href="/ueber-uns">Über uns</a>
    <a href="/kontakt">Kontakt</a>
  </nav>
</header>
<main>
<h1>Impressum</h1>
<p>Glaserei Scheibenfabel<br>
Inhaber: Gustav Glas<br>
Fensterweg 21<br>
59595 Gläserfeld</p>
<p>Telefon: +49 5959 595959<br>
E-Mail: <span id="mail-adresse"></span></p>
<p>USt-IdNr.: DE778899001</p>
</main>
<footer>
  <nav aria-label="Rechtliches">
    <a href="/impressum">Impressum</a>
    <a href="/datenschutz">Datenschutz</a>
  </nav>
  <p>© 2026 Glaserei Scheibenfabel</p>
</footer>
<script>
  (function () {
    var teile = ['kontakt', 'scheibenfabel', 'example'];
    var ziel = document.getElementById('mail-adresse');
    ziel.textContent = teile[0] + String.fromCharCode(64) + teile[1] + '.' + teile[2];
  })();
</script>
</body>
</html>
